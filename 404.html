<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Homework Launchpad</title>
<link rel="icon" type="image/png" href="https://civilinitiatives.org/favicon.png">
<style>
  /* Laid out like GitHub Pages' own "404 - File not found" page, with the
     school crest and the Launchpad's name instead of GitHub's. */
  :root{ --bg:#fff; --ink:#24292f; --soft:#57606a; --big:#d0d7de; --rule:#d8dee4; --link:#0969da; }
  @media (prefers-color-scheme: dark){ :root{
    --bg:#0d1117; --ink:#e6edf3; --soft:#8d96a0; --big:#30363d; --rule:#21262d; --link:#4493f8; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px}
  .container{width:100%;max-width:600px;margin:12vh auto 0;text-align:center}
  h1{font-size:clamp(5rem,22vw,9.5rem);line-height:1;margin:0 0 .15em;color:var(--big);font-weight:600;letter-spacing:-.04em}
  .what{font-weight:600;font-size:1.05rem;margin:0 0 .5rem}
  p{margin:0 0 1rem;color:var(--soft)}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  a:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:4px}
  .back{display:inline-block;margin-top:.5rem;font-weight:600}
  footer{margin:auto 0 0;width:100%;max-width:600px;border-top:1px solid var(--rule);padding:22px 0 30px;
         display:flex;align-items:center;justify-content:center;gap:10px;color:var(--soft);font-size:.86rem}
  footer img{width:30px;height:30px;border-radius:4px}
  @media (min-height:700px){ footer{margin-top:auto} }
</style>
</head>
<body>
<div class="container" id="box" hidden>
  <h1>404</h1>
  <p class="what">File not found</p>
  <p id="why">The site configured at this address does not contain the requested file.</p>
  <a class="back" href="https://civilinitiatives.org/">&larr; Back to the Homework Launchpad</a>
</div>
<footer id="foot" hidden>
  <img src="https://civilinitiatives.org/favicon.png" alt="">
  <span>Homework Launchpad</span>
</footer>

<script>
/* ---------------------------------------------------------------
   Two jobs.

   1. The site used to live at silocell.github.io/HEH-Homework/ and the
      games at /HEH-Launchpad-Game/ and so on. Each of those is now a
      domain of its own, and GitHub redirects the old address here while
      keeping the whole path - so a bookmark arrives as
      civilinitiatives.org/HEH-Homework/notes.html, which is not a page
      that exists. Strip the old folder and send them on.

   2. Anything else is a dead end: a genuinely missing page, or a game
      that this account isn't allowed to open (games-gate.js sends them
      here). It says nothing about why - only "not found" and the way
      back to the Launchpad.
   --------------------------------------------------------------- */
(function(){
  var m = location.pathname.match(/^\/HEH-[A-Za-z-]+\/(.*)$/);
  if (m) {
    location.replace("/" + m[1] + location.search + location.hash);
    return;                       // replace(), so Back doesn't bounce
  }
  document.getElementById("box").hidden = false;
  document.getElementById("foot").hidden = false;
})();
</script>
</body>
</html>
